<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Parigot Presentes</title>
    <link rel="stylesheet" href="cadastro.css">
    <script src="cadastro.js" defer></script>
</head>
<body>
    <main class="pagina-cadastro">
        <section class="cartao-cadastro" aria-labelledby="titulo-cadastro">
            <a class="marca" href="../dashboard/dashboard.html" aria-label="Parigot Presentes - página inicial">
                <span class="marca-icone" aria-hidden="true">P</span>
                <span>Parigot <strong>Presentes</strong></span>
            </a>

            <header class="introducao">
                <p class="chamada">Faça parte da nossa loja</p>
                <h1 id="titulo-cadastro">Crie sua conta</h1>
                <p class="descricao">Preencha seus dados para começar a comprar.</p>
            </header>

            <form id="formCadastro" class="formulario-cadastro" novalidate>
                <div class="campo campo-completo">
                    <label for="nome_pessoa">Nome completo</label>
                    <input type="text" id="nome_pessoa" name="nome_pessoa" maxlength="60"
                        placeholder="Digite seu nome completo" autocomplete="name" required>
                </div>

                <div class="campo">
                    <label for="cpf_pessoa">CPF</label>
                    <input type="text" id="cpf_pessoa" name="cpf_pessoa" placeholder="000.000.000-00"
                        inputmode="numeric" maxlength="14" autocomplete="off" required>
                </div>

                <div class="campo">
                    <label for="data_nascimento_pessoa">Data de nascimento</label>
                    <input type="date" id="data_nascimento_pessoa" name="data_nascimento_pessoa"
                        autocomplete="bday" required>
                </div>

                <div class="campo campo-completo">
                    <label for="endereco_pessoa">Endereço</label>
                    <input type="text" id="endereco_pessoa" name="endereco_pessoa" maxlength="150"
                        placeholder="Rua, número, bairro e cidade" autocomplete="street-address" required>
                </div>

                <div class="campo campo-completo">
                    <label for="email_pessoa">E-mail</label>
                    <input type="email" id="email_pessoa" name="email_pessoa" maxlength="75"
                        placeholder="seuemail@exemplo.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha_pessoa">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha_pessoa" name="senha_pessoa"
                            placeholder="Crie uma senha" autocomplete="new-password" required>
                        <button type="button" class="alternar-senha" data-alvo="senha_pessoa" aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="confirmar_senha">Confirmar senha</label>
                    <div class="campo-senha">
                        <input type="password" id="confirmar_senha" name="confirmar_senha"
                            placeholder="Digite a senha novamente" autocomplete="new-password" required>
                        <button type="button" class="alternar-senha" data-alvo="confirmar_senha" aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao-confirmar" id="botaoCadastrar">Criar conta</button>
                <p id="mensagemCadastro" class="mensagem-cadastro" role="status" aria-live="polite"></p>
            </form>

            <p class="link-login">Já possui uma conta? <a href="../login/login.html">Faça login</a></p>
        </section>
    </main>
</body>
</html>
