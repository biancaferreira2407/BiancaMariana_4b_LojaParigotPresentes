<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Parigot Presentes</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>
    <main class="pagina-login">
        <section class="cartao-login" aria-labelledby="titulo-login">
            <a class="marca" href="../dashboard/dashboard.html" aria-label="Parigot Presentes - página inicial">
                <span class="marca-icone" aria-hidden="true">P</span>
                <span>Parigot <strong>Presentes</strong></span>
            </a>

            <div class="introducao">
                <p class="chamada">Bem-vindo de volta</p>
                <h1 id="titulo-login">Entre na sua conta</h1>
            </div>

            <form id="formLogin" class="formulario-login">
                <div class="campo">
                    <label for="usuario">E-mail</label>
                    <input type="email" id="usuario" name="usuario" placeholder="Digite seu e-mail"
                        autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                            autocomplete="current-password" required>
                        <button type="button" id="alternarSenha" class="alternar-senha" aria-label="Mostrar senha">
                            <svg id="iconeOlho" xmlns="http://www.w3.org/2000/svg" width="21" height="21"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao-confirmar">Entrar</button>
                <p id="mensagemLogin" class="mensagem-login" role="status" aria-live="polite"></p>
            </form>

            <nav class="links-login" aria-label="Ajuda com a conta">
                <a href="../cadastro/cadastro.html">Criar uma conta</a>
                <span aria-hidden="true">•</span>
                <a href="../esqueciSenha/esqueciSenha.html">Esqueci minha senha</a>
            </nav>
        </section>
    </main>

    <!-- Janela de escolha de perfil -->
<div id="modalPerfil" class="modal-perfil" hidden>
    <div class="cartao-perfil">
        <h2>Você quer entrar como cliente ou administrador?</h2>

        <div class="botoes-perfil">
            <button type="button" id="btnCliente">
                Cliente
            </button>

            <button type="button" id="btnAdmin">
                Admin
            </button>
        </div>
    </div>
</div>

</body>

</html>
